services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dca_timetable
      POSTGRES_USER: dca
      POSTGRES_PASSWORD: change-this-before-production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dca -d dca_timetable"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://dca:change-this-before-production@database:5432/dca_timetable?schema=public
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      database:
        condition: service_healthy
volumes:
  postgres_data:
